# EKS UAT example — namespace axway (replace account/URLs for your env)
# Uso: helm upgrade --install axway-mcp ./helm/axway-mcp -n axway -f helm/axway-mcp/values-eks-uat-axway.yaml

replicaCount: 1

image:
  repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/apim-mcp
  pullPolicy: Always
  tag: "1.0.17-axway-std-eks-fed"

env:
  TRANSPORT_MODE: "http"
  PORT: "3000"
  TZ: "America/Sao_Paulo"

  AXWAY_GATEWAY_URL: "https://axway-apim-apigateway-tst-anm.axway.svc.cluster.local:8090/api"
  AXWAY_MANAGER_URL: "https://axway-apim-apigateway-tst-apimgr.axway.svc.cluster.local:8075/api/portal/v1.4"

  AXWAY_TLS_REJECT_UNAUTHORIZED: "false"
  AXWAY_TLS_INSECURE: "false"

  MCP_AUTH_MODE: "oidc"
  OIDC_ISSUER: "https://idp.example.com/realms/apim-mcp"
  OIDC_AUDIENCE: "apim-mcp-api"
  MCP_RESOURCE_URL: "https://apim-mcp.uat.example.intranet"
  MCP_REQUIRED_SCOPES: "mcp:observe"

secrets:
  create: false
  name: axway-mcp-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
