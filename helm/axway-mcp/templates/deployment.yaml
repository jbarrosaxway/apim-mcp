apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axway-mcp.fullname" . }}
  labels:
    {{- include "axway-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "axway-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axway-mcp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "axway-mcp.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: TRANSPORT_MODE
              value: {{ .Values.env.TRANSPORT_MODE | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            - name: AXWAY_GATEWAY_URL
              value: {{ .Values.env.AXWAY_GATEWAY_URL | quote }}
            - name: AXWAY_MANAGER_URL
              value: {{ .Values.env.AXWAY_MANAGER_URL | quote }}
            - name: AXWAY_TLS_REJECT_UNAUTHORIZED
              value: {{ .Values.env.AXWAY_TLS_REJECT_UNAUTHORIZED | quote }}
            - name: AXWAY_TLS_INSECURE
              value: {{ .Values.env.AXWAY_TLS_INSECURE | quote }}
            - name: MCP_AUTH_MODE
              value: {{ .Values.env.MCP_AUTH_MODE | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.env.OIDC_ISSUER | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.env.OIDC_AUDIENCE | quote }}
            - name: MCP_RESOURCE_URL
              value: {{ .Values.env.MCP_RESOURCE_URL | quote }}
            - name: MCP_REQUIRED_SCOPES
              value: {{ .Values.env.MCP_REQUIRED_SCOPES | quote }}
            {{- if .Values.env.OIDC_JWKS_URI }}
            - name: OIDC_JWKS_URI
              value: {{ .Values.env.OIDC_JWKS_URI | quote }}
            {{- end }}

            {{- /* Axway users + passwords: always from Secret when secrets.name is set */ -}}
            {{- if .Values.secrets.name }}
            - name: AXWAY_GATEWAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.keys.gatewayUsername }}
            - name: AXWAY_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.keys.gatewayPassword }}
            - name: AXWAY_MANAGER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.keys.managerUsername }}
            - name: AXWAY_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.keys.managerPassword }}
            {{- else }}
            {{- fail "secrets.name is required: put Axway usernames and passwords in a Kubernetes Secret (see README / docs)" }}
            {{- end }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
