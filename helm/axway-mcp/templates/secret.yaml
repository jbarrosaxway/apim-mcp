{{- /*
Optional Secret for Axway credentials.
Prefer creating the Secret out-of-band (kubectl / ExternalSecrets / SealedSecrets)
and setting secrets.create=false with secrets.name pointing at it.

Only set secrets.create=true for disposable lab — credentials then land in Helm values/history.
*/ -}}
{{- if and .Values.secrets.name .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "axway-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.gatewayUsername }}: {{ required "secrets.stringData.gatewayUsername required when secrets.create=true" .Values.secrets.stringData.gatewayUsername | quote }}
  {{ .Values.secrets.keys.gatewayPassword }}: {{ required "secrets.stringData.gatewayPassword required when secrets.create=true" .Values.secrets.stringData.gatewayPassword | quote }}
  {{ .Values.secrets.keys.managerUsername }}: {{ required "secrets.stringData.managerUsername required when secrets.create=true" .Values.secrets.stringData.managerUsername | quote }}
  {{ .Values.secrets.keys.managerPassword }}: {{ required "secrets.stringData.managerPassword required when secrets.create=true" .Values.secrets.stringData.managerPassword | quote }}
{{- end }}
