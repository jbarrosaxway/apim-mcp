# Example Secret Values file for APIM Lab credentials
# DO NOT commit the actual credentials. Copy this file to values-lab-secret.yaml (ignored by git).
#
# Usage:
#   helm upgrade --install axway-mcp ./helm/axway-mcp -n axway \
#     -f ./helm/axway-mcp/values-lab.yaml \
#     -f ./helm/axway-mcp/values-lab-secret.yaml

secrets:
  name: "axway-mcp-credentials-lab"
  create: true
  stringData:
    gatewayUsername: "admin"
    gatewayPassword: "YOUR_GATEWAY_ADMIN_PASSWORD"
    managerUsername: "apiadmin"
    managerPassword: "YOUR_API_MANAGER_PASSWORD"
