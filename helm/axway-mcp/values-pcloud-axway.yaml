# pcloud (Rancher local) — namespace axway
# pcloud (Rancher local) — namespace axway
# ANM/APIMgr via tunnel/ingress (placeholders example.com — replace for your env)
#
# Uso:
#   pwsh -File scripts/deploy-pcloud-axway.ps1

replicaCount: 1

image:
  # Substituído pelo script (NodePort do registry in-cluster)
  repository: docker-registry.registry.svc.cluster.local:5000/apim-mcp
  pullPolicy: IfNotPresent
  tag: "1.0.30-pcloud-apimgr-base"

imagePullSecrets: []

env:
  AXWAY_GATEWAY_HOME: "/opt/Axway"

  TRANSPORT_MODE: "http"
  PORT: "3000"
  TZ: "America/Sao_Paulo"

  AXWAY_GATEWAY_URL: "https://anm.example.com/api"
  AXWAY_MANAGER_URL: "https://apimgr.example.com/api/portal/v1.4"

  AXWAY_TLS_REJECT_UNAUTHORIZED: "false"
  AXWAY_TLS_INSECURE: "false"

  # Teste sem OIDC: auth desabilitado + perfil somente leitura (observe).
  MCP_AUTH_DISABLED: "true"
  MCP_AUTH_MODE: "none"
  MCP_DEPLOYMENT_PROFILE: "observer"
  OIDC_ISSUER: "https://idp.example.com/realms/apim-mcp"
  OIDC_AUDIENCE: "apim-mcp-api"
  MCP_RESOURCE_URL: "https://apim-mcp.example.com"
  MCP_REQUIRED_SCOPES: "mcp:observe"

  FRAGMENT_CLEANUP_ENABLED: "true"
  FRAGMENT_ARTIFACT_MAX_AGE_MS: "86400000"
  FRAGMENT_UPLOAD_MAX_BYTES: "10485760"

secrets:
  create: false
  name: axway-mcp-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
