# pcloud (Rancher local) — namespace axway
# ANM/APIMgr via Cloudflare Tunnel (gnosistech.com.br)
#
# Uso:
#   pwsh -File scripts/deploy-pcloud-axway.ps1

replicaCount: 1

image:
  # Substituído pelo script (NodePort do registry in-cluster)
  repository: docker-registry.registry.svc.cluster.local:5000/apim-mcp
  pullPolicy: IfNotPresent
  tag: "1.0.21-pcloud-apimgr-base"

imagePullSecrets: []

env:
  AXWAY_GATEWAY_HOME: "/opt/Axway"

  TRANSPORT_MODE: "http"
  PORT: "3000"
  TZ: "America/Sao_Paulo"

  AXWAY_GATEWAY_URL: "https://anm.gnosistech.com.br/api"
  AXWAY_MANAGER_URL: "https://apimgr.gnosistech.com.br/api/portal/v1.4"

  AXWAY_TLS_REJECT_UNAUTHORIZED: "false"
  AXWAY_TLS_INSECURE: "false"

  MCP_AUTH_MODE: "oidc"
  OIDC_ISSUER: "https://idp.gnosistech.com.br/realms/apim-mcp"
  OIDC_AUDIENCE: "apim-mcp-api"
  MCP_RESOURCE_URL: "https://apim-mcp.gnosistech.com.br"
  MCP_REQUIRED_SCOPES: "mcp:observe"

secrets:
  create: false
  name: axway-mcp-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
