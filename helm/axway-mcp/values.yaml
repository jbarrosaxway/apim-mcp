# Default values for axway-mcp chart.

replicaCount: 1

image:
  repository: axwayjbarros/apim-mcp
  pullPolicy: IfNotPresent
  tag: "1.0.17-axway-std"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Non-secret configuration (URLs, TLS, OIDC).
# Usernames and passwords MUST come from secrets (see below) — never commit them here.
env:
  TRANSPORT_MODE: "http"
  PORT: "3000"
  TZ: "UTC"

  AXWAY_GATEWAY_URL: ""
  AXWAY_MANAGER_URL: ""

  AXWAY_TLS_REJECT_UNAUTHORIZED: "false"
  AXWAY_TLS_INSECURE: "false"

  MCP_AUTH_MODE: "none"
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: ""
  MCP_RESOURCE_URL: ""
  MCP_REQUIRED_SCOPES: "mcp:observe"

# Kubernetes Secret with Axway credentials (required).
# Create out-of-band (recommended):
#   kubectl -n <ns> create secret generic axway-mcp-credentials \
#     --from-literal=AXWAY_GATEWAY_USERNAME='...' \
#     --from-literal=AXWAY_GATEWAY_PASSWORD='...' \
#     --from-literal=AXWAY_MANAGER_USERNAME='...' \
#     --from-literal=AXWAY_MANAGER_PASSWORD='...'
secrets:
  name: "axway-mcp-credentials"
  # true = chart creates the Secret from stringData (lab only; avoid in prod — ends up in Helm history)
  create: false
  keys:
    gatewayUsername: AXWAY_GATEWAY_USERNAME
    gatewayPassword: AXWAY_GATEWAY_PASSWORD
    managerUsername: AXWAY_MANAGER_USERNAME
    managerPassword: AXWAY_MANAGER_PASSWORD
  stringData:
    gatewayUsername: ""
    gatewayPassword: ""
    managerUsername: ""
    managerPassword: ""

resources: {}

probes:
  liveness:
    enabled: true
    tcpSocket:
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    enabled: true
    tcpSocket:
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
